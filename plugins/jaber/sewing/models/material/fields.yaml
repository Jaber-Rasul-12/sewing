fields:
    name:
        label: 'jaber.sewing::lang.model.material.name'
        span: auto
        type: text
    supplier:
        label: 'jaber.sewing::lang.model.material.supplier'
        span: auto
        type: relation
        select: name
        placeholder: 'jaber.sewing::lang.plugin.select'
    units:
        label: 'jaber.sewing::lang.model.material.units'
        span: auto
        type: relation
        select: name
        placeholder: 'jaber.sewing::lang.plugin.select'
    _logbook@update:
            type: jacob_logbook_log
            limitPerPage: 10 
            startPage: 1 
            permissions: log_changes_sewing
            showUndoChangesButton: true 
            refreshFormAfterUndo: true 