fields:
    customer:
        label: 'jaber.sewing::lang.model.order.customer'
        span: auto
        type: relation
        select: name
        placeholder: 'jaber.sewing::lang.plugin.select'
    model:
        label: 'jaber.sewing::lang.model.order.model'
        span: auto
        type: relation
        select: name
        placeholder: 'jaber.sewing::lang.plugin.select'
    order_date:
        label: 'jaber.sewing::lang.model.order.order_date'
        span: auto
        type: datepicker
        mode: date
        ignoreTimezone: true
    due_date:
        label: 'jaber.sewing::lang.model.order.due_date'
        span: auto
        type: datepicker
        mode: date
        ignoreTimezone: true
    status:
        label: 'jaber.sewing::lang.model.order.status'
        span: auto
        type: dropdown
        placeholder: 'jaber.sewing::lang.plugin.select'
        options:
            ready: 'jaber.sewing::lang.model.order.ready'
            delivered: 'jaber.sewing::lang.model.order.delivered'
            cancelled: 'jaber.sewing::lang.model.order.cancelled'
    total:
        label: 'jaber.sewing::lang.model.order.total'
        span: auto
        type: number
    orderItems:
        label: 'jaber.sewing::lang.plugin.order_items'
        type: relationmanager
        context: ['update', 'preview']
    _logbook@update:
            type: jacob_logbook_log
            limitPerPage: 10 
            startPage: 1 
            permissions: log_changes_sewing
            showUndoChangesButton: true 
            refreshFormAfterUndo: true 