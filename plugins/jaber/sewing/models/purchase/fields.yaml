fields:
    material:
        label: 'jaber.sewing::lang.model.purchase.material'
        span: auto
        type: relation
        placeholder: 'jaber.sewing::lang.plugin.select'
    unit_id:
        label: 'jaber.sewing::lang.model.purchase.unit'
        span: auto
        type: dropdown
        dependsOn: material
        placeholder: 'jaber.sewing::lang.plugin.select'
    supplier:
        label: 'jaber.sewing::lang.model.purchase.supplier'
        span: auto
        type: relation
        placeholder: 'jaber.sewing::lang.plugin.select'
    purchase_date:
        label: 'jaber.sewing::lang.model.purchase.purchase_date'
        span: auto
        type: datepicker
        ignoreTimezone: true
        mode: date
    quantity:
        label: 'jaber.sewing::lang.model.purchase.quantity'
        span: auto
        type: number
    unit_price:
        label: 'jaber.sewing::lang.model.purchase.unit_price'
        span: auto
        type: number
    total_price:
        label: 'jaber.sewing::lang.model.purchase.total_price'
        span: auto
        dependsOn:
            - unit_price
            - quantity
        type: number
    uuid:
        label: 'jaber.sewing::lang.model.purchase.uuid'
        span: auto
        readOnly: true
        context: ['update','preview']
        type: text
    photos:
        label: 'jaber.sewing::lang.model.purchase.photos'
        type: fileupload
        span: auto
        mode: image
        imageHeight: 260
        imageWidth: 260
        thumbOptions:
            mode: crop
            offset:
                - 0
                - 0
            quality: 90
            sharpen: 0
            interlace: false
            extension: auto
    _logbook@update:
            type: jacob_logbook_log
            limitPerPage: 10 
            startPage: 1 
            permissions: log_changes_sewing
            showUndoChangesButton: true 
            refreshFormAfterUndo: true 